:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#09090b;color:#f4f1ea;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}body{display:grid;place-items:center;overflow:hidden}.loading{display:flex;flex-direction:column;align-items:center;gap:16px}.mark{width:50px;height:50px;border:1px solid rgba(139,92,246,.5);border-radius:16px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,rgba(59,130,246,.22),rgba(139,92,246,.28));box-shadow:0 20px 70px rgba(80,60,220,.25)}.copy{font-size:12px;letter-spacing:.16em;color:#8e8c98}.bar{width:150px;height:2px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.08)}.bar:after{content:"";display:block;width:45%;height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);animation:move 1s ease-in-out infinite}@keyframes move{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}</style>

<body>

<script>
(async()=>{
  try{
    const b64=(window.__SITE_PARTS__||[]).join('');
    if(!b64) throw new Error('Missing site payload');
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(error){
    console.error(error);
    document.body.innerHTML='<div style="max-width:520px;padding:32px;text-align:center;line-height:1.8;color:#aaa8b0"><strong style="display:block;color:#f4f1ea;font-size:22px;margin-bottom:12px">页面载入失败</strong>请刷新页面后重新打开。</div>';
  }
})();
</script>
