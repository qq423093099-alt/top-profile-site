name: Update identity to PMO and AI FDE

on:
  push:
    paths:
      - '.github/workflows/update-identity-ai-fde.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update homepage identity
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          replacements = [
              ('TOP十年（梁俊铭）：商业IP操盘手、IP访谈创作者、项目PMO，擅长内容商业化、跨团队协同与复杂项目推进。',
               'TOP｜梁俊铭：商业IP操盘手、IP访谈创作者、PMO、AI FDE，擅长内容商业化、AI落地、跨团队协同与复杂项目推进。'),
              ('TOP 十年｜商业IP操盘手 · IP访谈创作者 · 项目PMO',
               'TOP｜梁俊铭｜商业IP操盘手 · IP访谈创作者 · PMO · AI FDE'),
              ('<a class="brand" href="#top"><span class="brand-mark">T</span><span>TOP 十年</span></a>',
               '<a class="brand" href="#top"><span class="brand-mark">T</span><span>TOP｜梁俊铭</span></a>'),
              ('<div class="portrait-monogram"><span>TOP</span><small>十年</small></div>',
               '<div class="portrait-monogram identity-name"><span>TOP｜梁俊铭</span><small>十年的会客厅 &amp; 十年的CEO进化论</small></div>'),
              ('<h2 class="smart-title"><span>商业IP操盘手</span><span>IP访谈创作者</span><span>项目PMO</span></h2>',
               '<h2 class="smart-title"><span>商业IP操盘手</span><span>IP访谈创作者</span><span>PMO</span><span>AI FDE</span></h2>'),
              ('<div class="tag-row"><span>创始人幕僚</span><span>内容 × 商业</span><span>大湾区</span><span>New Money</span></div>',
               '<div class="tag-row"><span>内容 × 商业 × AI</span><span>大湾区</span><span>New Money</span></div>'),
              ('<span>创始人幕僚型</span><span>项目PMO</span>',
               '<span>项目PMO</span><span>与AI FDE</span>'),
              ('梁俊铭 · TOP / 十年 · 深圳', 'TOP｜梁俊铭 · 深圳'),
              ('© 2026 TOP 十年', '© 2026 TOP｜梁俊铭'),
          ]

          for old, new in replacements:
              if old not in html:
                  raise SystemExit(f'Missing expected text: {old}')
              html = html.replace(old, new)

          css_anchor = '.portrait-monogram small { color:#b5b1bc; letter-spacing:.45em; margin-left:.45em; font-size:12px; }'
          css_addition = css_anchor + '\n.identity-name span { font-size:clamp(36px,4.2vw,58px); letter-spacing:-.055em; text-align:center; white-space:nowrap; }\n.identity-name small { max-width:100%; margin:14px 0 0; font-size:12px; line-height:1.6; letter-spacing:.04em; text-align:center; color:#b5b1bc; }'
          if '.identity-name span {' not in html:
              if css_anchor not in html:
                  raise SystemExit('Missing portrait CSS anchor')
              html = html.replace(css_anchor, css_addition)

          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh homepage identity and social accounts"
          git push origin main
