name: Change visible PMO label

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/change-visible-pmo.yml

permissions:
  contents: write

jobs:
  update-label:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Replace identity label
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<h2 class="smart-title"><span>商业IP操盘手</span><span>IP访谈创作者</span><span>项目PMO</span></h2>'
          new = '<h2 class="smart-title"><span>商业IP操盘手</span><span>IP访谈创作者</span><span>PMO</span></h2>'
          if old not in text:
              raise SystemExit('Target identity block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Change visible role label to PMO"
          git push
