<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050a18">
  <title>十年的会客厅｜视频号</title>
  <meta name="description" content="扫码或长按二维码，关注视频号「十年的会客厅」。">
  <style>
    :root{color-scheme:dark;--bg:#050a18;--panel:#0a1833;--line:rgba(87,145,255,.28);--blue:#398cff;--blue2:#76b4ff;--text:#f5f8ff;--muted:#99abc6}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
    body{min-height:100vh;display:grid;place-items:center;padding:28px;background:
      radial-gradient(circle at 78% 16%,rgba(61,83,255,.28),transparent 34%),
      radial-gradient(circle at 16% 88%,rgba(20,116,255,.18),transparent 32%),
      #050a18}
    .shell{width:min(100%,920px);display:grid;grid-template-columns:1fr minmax(320px,430px);gap:54px;align-items:center}
    .eyebrow{margin:0 0 18px;color:var(--blue2);font-size:12px;font-weight:800;letter-spacing:.18em}
    h1{margin:0;font-size:clamp(42px,7vw,76px);line-height:1.02;letter-spacing:-.06em}
    h1 span{display:block;color:var(--blue);font-size:.42em;letter-spacing:.02em;margin-bottom:14px}
    .intro{max-width:500px;margin:28px 0 0;color:var(--muted);font-size:16px;line-height:1.9}
    .steps{display:grid;gap:10px;margin:28px 0 0;padding:0;list-style:none;color:#c7d5e9;font-size:14px}
    .steps li{display:flex;gap:10px;align-items:center}.steps b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#102b5d;color:var(--blue2);font-size:11px}
    .actions{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
    .button{min-height:46px;display:inline-flex;align-items:center;justify-content:center;padding:0 20px;border:1px solid var(--line);border-radius:999px;color:#eaf3ff;text-decoration:none;font-size:13px;font-weight:750;background:rgba(10,29,61,.7)}
    .button.primary{border-color:transparent;background:linear-gradient(135deg,#3b90ff,#145fe5);box-shadow:0 15px 44px rgba(27,104,255,.3)}
    .qr-card{position:relative;padding:18px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(17,39,80,.92),rgba(5,16,37,.96));box-shadow:0 30px 100px rgba(0,0,0,.42)}
    .qr-card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;background:linear-gradient(135deg,rgba(84,160,255,.28),transparent 36%,rgba(109,71,255,.18));pointer-events:none}
    .qr-card img{position:relative;display:block;width:100%;height:auto;border-radius:18px;background:#fff}
    .qr-label{position:relative;display:flex;justify-content:space-between;gap:16px;align-items:center;padding:16px 6px 2px}
    .qr-label strong{font-size:15px}.qr-label span{color:var(--blue2);font-size:11px}
    @media(max-width:760px){body{padding:22px}.shell{grid-template-columns:1fr;gap:30px}.copy{text-align:center}.intro{margin-inline:auto}.steps{width:max-content;max-width:100%;margin-inline:auto;text-align:left}.actions{justify-content:center}.qr-card{width:min(100%,430px);margin-inline:auto;order:-1}}
  </style>
</head>
